<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>0.1 秒，你就给他打了分</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f5eedc; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script>
// 默认加载整片；?cover=1&w=..&h=.. 封面
(function () {
  const P = new URLSearchParams(location.search);
  const list = P.get('cover') ? ['chars', 'props', 'cover'] : ['chars', 'props', 'film'];
  let i = 0;
  (function next() {
    if (i >= list.length) { boot(); return; }
    const s = document.createElement('script'); s.src = 'scenes/' + list[i++] + '.js'; s.onload = next; document.head.appendChild(s);
  })();
})();
</script>
</body>
</html>
